version: "2"

linters:
  enable:
    - errcheck       # all errors must be handled
    - govet          # go vet checks (printf, composites, etc.)
    - staticcheck    # static analysis (SA*, S1*, QF*)
    - unused         # no dead exported identifiers
    - gofmt          # formatting (also enforced by goimports)
    - goimports      # import ordering + gofmt
    - gosec          # security: SQL injection, hardcoded creds, weak crypto
    - revive         # style linter (replaces golint)
    - misspell       # typos in comments and string literals
    - gocyclo        # flag high cyclomatic complexity
    - gocritic       # collection of opinionated checks
    - bodyclose      # ensure http response bodies are closed
    - noctx          # http requests should carry a context
    - prealloc        # suggest slice pre-allocation
    - unparam        # detect unused function parameters

linters-settings:
  gocyclo:
    min-complexity: 15

  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true

  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: package-comments
      - name: error-return
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-declaration
      - name: range
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # errors unhandled — covered by errcheck

  misspell:
    locale: US

  goimports:
    local-prefixes: stonesuite-backend

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files get relaxed rules
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - unparam
    # Main entry point may use log.Fatal
    - path: main\.go
      linters:
        - revive

run:
  timeout: 5m
  modules-download-mode: readonly
