services:
  postgres:
    image: postgres:16-alpine
    container_name: stonesuite-db
    environment:
      # Control-plane DB is auto-created on a fresh volume. Tenant databases
      # (tenant_<slug>) are created at provisioning time via the admin connection.
      POSTGRES_DB: stonesuite_cp
      POSTGRES_USER: stonesuite
      POSTGRES_PASSWORD: stonesuite_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonesuite"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: stonesuite-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stonesuite-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
      # Multi-tenant control plane (required). The provisioner uses the admin
      # connection to create per-tenant databases on the same Postgres.
      CONTROL_PLANE_DB_URL: "postgres://stonesuite:stonesuite_secret@postgres:5432/stonesuite_cp?sslmode=disable"
      PROVISION_ADMIN_DB_URL: "postgres://stonesuite:stonesuite_secret@postgres:5432/postgres?sslmode=disable"
      FRONTEND_URL: "http://localhost:5173"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176"
      JWT_SECRET: "${JWT_SECRET:-dev_only_DO_NOT_USE_IN_PROD}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: stonesuite-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules  # anonymous volume keeps container node_modules isolated from host
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8080/api"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  postgres_data:
