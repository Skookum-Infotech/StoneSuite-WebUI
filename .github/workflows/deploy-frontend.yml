name: Deploy Frontend to Cloudflare Pages

on:
  pull_request:
    types: [closed]
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    name: Lint → Build → Deploy → Verify
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Keep in sync with ci-frontend.yml: Node 20 is past EOL (April
          # 2026) and jsdom 30's undici dependency calls
          # worker_threads.markAsUncloneable, which doesn't exist on Node 20.
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Prod is same-origin: VITE_API_BASE_URL must stay "/api" so traffic
          # routes through functions/api/[[path]].ts and the backend's auth
          # cookies stay first-party. client.ts defaults to "/api" when unset,
          # and vite.config's guard rejects an absolute URL here — so this is
          # deliberately NOT sourced from a variable (an absolute value in
          # vars.VITE_API_BASE_URL is exactly what used to fail every build).
          # The backend origin belongs on the Pages project as API_ORIGIN, not
          # in this build. See DEPLOY_FRONTEND.md.
          VITE_API_BASE_URL: /api
          VITE_NOTIFY_BASE_URL: ${{ vars.VITE_NOTIFY_BASE_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: stonesuite
          directory: dist
          branch: master

      - name: Health check
        run: |
          echo "Waiting for edge propagation..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://stonesuite.pages.dev)
          if [ "$STATUS" != "200" ]; then
            echo "Frontend health check failed — HTTP $STATUS"
            echo "Roll back via: Cloudflare Pages dashboard → Deployments → previous deploy → Rollback"
            exit 1
          fi
          echo "Frontend health check passed — HTTP $STATUS"
