<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 108" fill="none">
  <!-- Black pill background -->
  <rect x="52" y="4" width="344" height="100" rx="20" fill="#0f0f0f"/>
  <!-- Red circle (extends left of pill) -->
  <circle cx="68" cy="54" r="52" fill="#CC1B1B"/>
  <!-- "es" monogram — bold italic white -->
  <text
    x="68" y="72"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="52"
    font-weight="700"
    font-style="italic"
    fill="white"
    text-anchor="middle"
  >es</text>
  <!-- ELEVATION -->
  <text
    x="250" y="46"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="32"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="2"
  >ELEVATION</text>
  <!-- STONE -->
  <text
    x="250" y="83"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="24"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    letter-spacing="11"
  >STONE</text>
</svg>
